[package]
name = "skiss"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "An infinite canvas for your notes, stored as Markdown"
readme = "../../README.md"
keywords = ["cli", "markdown", "canvas", "notes", "whiteboard"]
categories = ["command-line-utilities"]

[[bin]]
name = "skiss"
path = "src/main.rs"

[dependencies]
skiss-core.workspace = true
ailloy.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
eframe.workspace = true
egui.workspace = true
notify.workspace = true
arboard.workspace = true
image.workspace = true
anyhow.workspace = true
colored.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
semver.workspace = true
chrono.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/skiss-v{ version }-{ target }.{ archive-format }"
bin-dir = "skiss{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
