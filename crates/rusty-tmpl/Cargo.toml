[package]
name = "rusty-tmpl"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A template for building Rust command-line tools"
readme = "../../README.md"
keywords = ["cli", "template", "starter", "scaffold"]
categories = ["command-line-utilities"]

[[bin]]
name = "rusty-tmpl"
path = "src/main.rs"

[dependencies]
rusty-tmpl-core.workspace = true
ailloy.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
colored.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
semver.workspace = true
chrono.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/rusty-tmpl-v{ version }-{ target }.{ archive-format }"
bin-dir = "rusty-tmpl{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
